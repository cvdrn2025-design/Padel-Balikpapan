<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Padel Balikpapan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header Admin & Tombol Keluar -->
        <div class="flex justify-between items-center mb-6 bg-zinc-800 p-4 rounded-xl border border-zinc-700">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">Padel Balikpapan - Dashboard Admin</h1>
                <p class="text-xs text-zinc-400">Akses Penuh Sistem POS</p>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded text-sm font-semibold transition duration-200">
                Keluar (Logout)
            </button>
        </div>

        <!-- TAMPILAN UTAMA KONTROL ADMIN -->
        <div class="bg-zinc-800 p-6 rounded-xl border border-zinc-700 shadow-xl space-y-6">
            <div class="text-center">
                <h2 class="text-2xl font-bold mb-1 text-emerald-400">PADEL BALIKPAPAN - POS SYSTEM</h2>
                <p class="text-xs text-zinc-400">Mode Kontrol Administrator</p>
            </div>

            <!-- Menu Akses Kasir -->
            <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-700">
                <div class="font-bold text-sm mb-2 text-zinc-300">Akses Kasir:</div>
                <button onclick="window.location.href='kasir.html'" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded transition duration-200 text-sm">
                    KASIR BALIKPAPAN
                </button>
            </div>

            <!-- Menu Akses Wasit -->
            <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-700">
                <div class="font-bold text-sm mb-2 text-zinc-300">Akses Wasit / Scoreboard (3 Lapangan):</div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <button onclick="window.location.href='wasit1.html'" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 px-4 rounded transition duration-200 text-sm">
                        WASIT Lap. 1
                    </button>
                    <button onclick="window.location.href='wasit2.html'" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 px-4 rounded transition duration-200 text-sm">
                        WASIT Lap. 2
                    </button>
                    <button onclick="window.location.href='wasit3.html'" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 px-4 rounded transition duration-200 text-sm">
                        WASIT Lap. 3
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Versi Kompatibilitas v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyA8pYn38FA1FRELUciMUr2bFX8XFCv0GBY",
            authDomain: "padel-balikpapan.firebaseapp.com",
            databaseURL: "https://padel-balikpapan-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "padel-balikpapan",
            storageBucket: "padel-balikpapan.firebasestorage.app",
            messagingSenderId: "832295578661",
            appId: "1:832295578661:web:b76ff44f7818c78827a3cc"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Sistem Keamanan: Penjaga Halaman Admin
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                // Jika belum login, otomatis ditendang kembali ke index.html
                window.location.href = "index.html";
            }
        });

        // Fungsi Logout
        function logoutAdmin() {
            firebase.auth().signOut().then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                alert("Gagal keluar: " + error.message);
            });
        }
    </script>
</body>
</html>
